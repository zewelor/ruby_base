---
services:
  app:
    build:
      context: .
      target: dev
    working_dir: ${PWD:?Run Compose from the project root}
    tty: true
    # Container root maps to the unprivileged rootless daemon user.
    user: "0:0"
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:mode=1777,exec
    stdin_open: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: .
        target: ${PWD:?Run Compose from the project root}
      # Empty volumes start owned by container root; do not copy image UID 1000.
      - type: volume
        source: bundler_rootless
        target: /bundle
        volume:
          nocopy: true

volumes:
  bundler_rootless:
