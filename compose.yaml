---
services:
  app:
    image: "${COMPOSE_PROJECT_NAME:?Run through dockerized.sh}-app"
    pull_policy: never
    build:
      context: .
      target: dev
    working_dir: ${DOCKER_PROJECT_DIR:?Run through dockerized.sh}
    tty: true
    # Container root maps to the unprivileged rootless daemon user.
    user: "0:0"
    environment:
      HOME: /tmp
      BUNDLE_PATH: "${DOCKER_BUNDLE_DIR:?Run through dockerized.sh}"
      GEM_HOME: "${DOCKER_BUNDLE_DIR:?Run through dockerized.sh}"
      XDG_CACHE_HOME: "${DOCKER_CACHE_DIR:?Run through dockerized.sh}"
      RUBOCOP_CACHE_ROOT: "${DOCKER_CACHE_DIR:?Run through dockerized.sh}/rubocop"
      BUNDLE_IGNORE_CONFIG: "true"
      BUNDLE_FROZEN: "true"
      BUNDLE_GEMFILE: "${DOCKER_PROJECT_DIR:?Run through dockerized.sh}/Gemfile"
    tmpfs:
      - /tmp:mode=1777,exec
    stdin_open: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: .
        target: ${DOCKER_PROJECT_DIR:?Run through dockerized.sh}
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCKER_GIT_COMMON_DIR:?Run through dockerized.sh}
        target: ${DOCKER_GIT_COMMON_DIR:?Run through dockerized.sh}
        bind:
          create_host_path: false

  editor:
    extends:
      service: app
    profiles:
      - editor
    network_mode: none
    # No build definition: --pull never cannot fall back to building an editor image.
    build: !reset null
    ports: !reset []
    env_file: !reset []
    entrypoint: !reset []
    # Editor startup uses the prepared bundle without installing dependencies.
    environment:
      BUNDLE_AUTO_INSTALL: "false"
    command:
      - bundle
      - exec
      - ruby-lsp
