---
name: Docker Checks

permissions:
  contents: read

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_FILE: compose.ci.yaml
  # It counts attestation packages; each commit gives three packages.
  OLD_VERSIONS_TO_KEEP: 75  # 25 commits
  DOCKER_BUILD_CHECKS_ANNOTATIONS: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          # Base images provide the named non-root users used by each runtime.
          ignore: DL3006,DL3008,DL3018,DL3066

      - name: Run droast (Dockerfile linter)
        uses: immanuwell/dockerfile-roast@1.5.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          cache-from: type=gha,scope=ci
          cache-to: >-
            ${{ github.event_name == 'push' &&
            'type=gha,mode=max,scope=ci' || '' }}
          target: ci
          # Used by compose.ci
          tags: image_ci:latest

      - name: Run Bundle Audit
        run: |
          docker compose run --rm app bundle exec bundler-audit check --update

      - name: Run StandardRB
        run: |
          docker compose run --rm app bundle exec standardrb

  build_production:
    if: github.event_name != 'push'
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: image_live:latest
          target: live
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=live
            type=gha,scope=ci
          build-args: |
            GIT_CODE_VERSION=${{ github.sha }}

  publish_production:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # full length sha
            type=sha,format=long,prefix=
          flavor: |
            latest=true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          target: live
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=live
            type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=live
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_CODE_VERSION=${{ github.sha }}

      - name: Delete old images
        if: github.event_name == 'push'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: ${{ env.OLD_VERSIONS_TO_KEEP }}
          keep-n-untagged: ${{ env.OLD_VERSIONS_TO_KEEP }}
          delete-partial-images: true
